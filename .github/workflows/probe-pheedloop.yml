name: Probe PheedLoop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/probe-pheedloop.mjs]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe PheedLoop
        env:
          PHEEDLOOP_API_KEY: ${{ secrets.PHEEDLOOP_API_KEY }}
          PHEEDLOOP_API_SECRET: ${{ secrets.PHEEDLOOP_API_SECRET }}
          PHEEDLOOP_ORG: ${{ secrets.PHEEDLOOP_ORG }}
        run: node scripts/probe-pheedloop.mjs
      - name: Save the probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_probe
          git commit -m "PheedLoop probe results" || echo "nothing to commit"
          git push
